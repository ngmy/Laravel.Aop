name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        laravel:
          - 12
          - 13
        exclude:
          - php: '8.2'
            laravel: 13
        include:
          - laravel: 12
            testbench: 10
          - laravel: 13
            testbench: 11
    name: PHP ${{ matrix.php }} + Laravel ${{ matrix.laravel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Update Composer to latest version
        run: sudo composer self-update

      - name: Validate composer.json
        run: composer validate

      - name: Require Laravel ${{ matrix.laravel }} and Testbench ${{ matrix.testbench }}
        run: |
          composer require --no-update "laravel/framework:^${{ matrix.laravel }}"
          composer require --no-update --dev "orchestra/testbench:^${{ matrix.testbench }}"

      - name: Install Composer dependencies
        run: |
          composer update --no-interaction
          composer update --no-interaction symfony/console:^7.0

      - name: Run lint
        run: composer lint
